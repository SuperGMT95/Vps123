<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CoreMMC Hosting - Ultimate Hub v3.0</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #5865F2; --bg: #ffffff; --text: #313338; --gray: #f2f3f5; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        
        /* Black Screen Fix */
        body, html { height: 100vh; width: 100vw; overflow: hidden; background: #ffffff !important; }

        /* --- LOADING SCREEN --- */
        #main-loader { position: fixed; inset: 0; background: #1e1f22; z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; }
        .spinner { width: 50px; height: 50px; border: 5px solid rgba(255,255,255,0.1); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s infinite linear; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* --- AUTH SYSTEM --- */
        .auth-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 9000; display: flex; align-items: center; justify-content: center; overflow-y: auto; padding: 20px; }
        .auth-card { background: white; width: 100%; max-width: 450px; padding: 30px; border-radius: 20px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .auth-card img { border-radius: 50%; margin-bottom: 10px; border: 3px solid var(--primary); }
        .input-box { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 10px; outline: none; background: #f9f9f9; transition: 0.3s; }
        .input-box:focus { border-color: var(--primary); }
        .btn-main { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 10px; }

        /* --- SETUP POPUP STYLES --- */
        #core-setup-popup { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:999999; overflow-y:auto; padding:20px; align-items:center; justify-content:center; backdrop-filter: blur(5px); }
        .setup-card { background:white; width:100%; max-width:450px; border-radius:24px; overflow:hidden; position:relative; box-shadow:0 20px 50px rgba(0,0,0,0.3); }
        .pop-banner { height:120px; background:#5865F2; position:relative; background-size: cover; background-position: center; }
        .pop-pfp-wrap { position:absolute; bottom:-40px; left:20px; }
        .pop-pfp-img { width:85px; height:85px; border-radius:50%; border:4px solid white; background:#eee; object-fit:cover; }

        /* --- MAIN APP UI --- */
        #app { display: none; height: 100vh; width: 100% !important; position: fixed !important; top: 0; left: 0; flex-direction: column; background: var(--bg); z-index: 1000; }
        .show-app { display: flex !important; }
        
        .header-bar { height: 55px; border-bottom: 1px solid #eee; display: flex; align-items: center; padding: 0 15px; font-weight: bold; gap: 10px; background: white; z-index: 100; }
        .content-panel { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
        .section { display: none; height: 100%; flex-direction: column; }
        .section.active { display: flex; }

        /* --- CHAT STYLES --- */
        #chat-area { flex: 1 !important; padding: 20px; overflow-y: auto !important; background: white !important; display: flex !important; flex-direction: column !important; gap: 15px; padding-bottom: 20px !important; }
        .message-bubble { display: flex; gap: 12px; margin-bottom: 5px; }
        .message-bubble img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
        .msg-text-wrap { background: #f1f2f6; padding: 10px 15px; border-radius: 0 18px 18px 18px; max-width: 80%; }
        .msg-user { font-size: 12px; font-weight: bold; color: var(--primary); margin-bottom: 3px; }

        .chat-input-bar { padding: 15px; border-top: 1px solid #eee; display: flex; gap: 10px; background: white; padding-bottom: 25px; }
        .chat-input-bar input { flex: 1; padding: 12px 20px; border: 1px solid #ddd; border-radius: 25px; outline: none; }
        .send-btn { background: var(--primary); color: white; border: none; width: 45px; height: 45px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        /* --- PROFILE STYLES --- */
        .profile-header-box { height: 140px; background: var(--primary); position: relative; background-size: cover; }
        .profile-img-large { width: 110px; height: 110px; border-radius: 50%; border: 5px solid white; position: absolute; bottom: -55px; left: 25px; background: #eee; object-fit: cover; }
        .profile-info { padding: 65px 25px 25px; overflow-y: auto; }

        /* --- BOTTOM NAV --- */
        .bottom-nav { height: 70px; border-top: 1px solid #eee; display: flex; justify-content: space-around; align-items: center; background: white; }
        .nav-tab { text-align: center; color: #888; cursor: pointer; flex: 1; }
        .nav-tab.active { color: var(--primary); }
    </style>
</head>
<body>

    <div id="main-loader"><div class="spinner"></div><h2 style="margin-top:20px;">CoreMMC Hosting</h2></div>

    <div id="core-setup-popup">
        <div class="setup-card">
            <div id="pop-banner-prev" class="pop-banner">
                <label for="banner-upload" style="position:absolute; top:10px; right:10px; background:rgba(0,0,0,0.5); color:white; padding:5px 10px; border-radius:15px; font-size:12px; cursor:pointer;"><i class="fas fa-camera"></i> Edit Banner</label>
                <input type="file" id="banner-upload" hidden onchange="previewImg(this, 'pop-banner-prev', true)">
                <div class="pop-pfp-wrap">
                    <img id="pop-pfp-prev" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" class="pop-pfp-img">
                    <label for="pfp-upload" style="position:absolute; bottom:0; right:0; background:white; padding:5px; border-radius:50%; box-shadow:0 2px 5px rgba(0,0,0,0.2); cursor:pointer;"><i class="fas fa-pen" style="font-size:10px;"></i></label>
                    <input type="file" id="pfp-upload" hidden onchange="previewImg(this, 'pop-pfp-prev', false)">
                </div>
            </div>
            <div style="padding:50px 25px 25px;">
                <h3 style="margin-bottom:15px; color:#313338;">Finalize Your Profile</h3>
                <input type="text" id="setup-username" class="input-box" placeholder="Choose Username">
                <input type="tel" id="setup-phone" class="input-box" placeholder="Phone Number">
                <input type="text" id="setup-address" class="input-box" placeholder="Address (Optional)">
                <div id="google-pass-fields">
                    <input type="password" id="setup-pass" class="input-box" placeholder="Create Hub Password">
                    <input type="password" id="setup-conf" class="input-box" placeholder="Confirm Password">
                </div>
                <button onclick="saveFinalProfile()" class="btn-main">Save & Start Chatting</button>
            </div>
        </div>
    </div>

    <div id="auth-screen" class="auth-overlay" style="display:none;">
        <div class="auth-card">
            <img src="https://i.ibb.co/KzF67sFZ/copilot-image-1761965106943.png" width="90">
            <h2 id="auth-title">CoreMMC Login</h2>
            <div id="login-fields">
                <input type="email" id="l-email" class="input-box" placeholder="Email Address">
                <input type="password" id="l-pass" class="input-box" placeholder="Password">
                <button class="btn-main" onclick="handleLogin()">Login to Hub</button>
                <button class="btn-main" style="background:#fff; color:#444; border:1px solid #ddd;" onclick="googleAuth()">
                    <img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" width="18"> Google Continue
                </button>
                <p style="margin-top:20px; font-size:14px; cursor:pointer; color:var(--primary);" onclick="toggleView('reg')">New Member? Register Now</p>
            </div>
            <div id="reg-fields" style="display:none;">
                <input type="text" id="r-name" class="input-box" placeholder="Full Name">
                <input type="email" id="r-email" class="input-box" placeholder="Email Address">
                <input type="password" id="r-pass" class="input-box" placeholder="Create Password">
                <input type="password" id="r-confirm" class="input-box" placeholder="Confirm Password">
                <button class="btn-main" onclick="handleRegister()">Register & Setup Profile</button>
                <p style="margin-top:20px; font-size:14px; cursor:pointer; color:var(--primary);" onclick="toggleView('login')">Back to Login</p>
            </div>
        </div>
    </div>

    <div id="app">
        <div class="header-bar">
            <img src="https://i.ibb.co/KzF67sFZ/copilot-image-1761965106943.png" width="35">
            <span>CoreMMC Hub</span>
        </div>
        <div class="content-panel">
            <div id="sec-public" class="section active">
                <div id="chat-area"></div>
                <div class="chat-input-bar">
                    <input type="text" id="msg-in" placeholder="Message CoreMMC members..." onkeypress="if(event.key==='Enter')sendMsg()">
                    <button class="send-btn" onclick="sendMsg()"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
            <div id="sec-dm" class="section">
                <div style="margin:auto; text-align:center; color:#888;"><i class="fas fa-user-shield" style="font-size:60px;"></i><h3>DMs Coming Soon</h3></div>
            </div>
            <div id="sec-profile" class="section">
                <div id="u-banner-bg" class="profile-header-box">
                    <img id="u-pfp" src="" class="profile-img-large">
                </div>
                <div class="profile-info">
                    <h1 id="u-name-display">User</h1>
                    <div style="background:#f8f9fa; padding:15px; border-radius:15px; margin-top:20px;">
                        <p><strong>Email:</strong> <span id="u-email-display">...</span></p>
                        <p style="margin-top:5px;"><strong>Role:</strong> Official Member</p>
                    </div>
                    <button onclick="document.getElementById('core-setup-popup').style.display='flex'" style="width:100%; padding:12px; margin-top:20px; border:1.5px solid var(--primary); background:none; color:var(--primary); border-radius:10px; font-weight:bold;">Edit Profile & Banner</button>
                    <button onclick="auth.signOut()" style="width:100%; padding:12px; margin-top:10px; background:#ed4245; color:white; border:none; border-radius:10px; font-weight:bold;">Logout</button>
                </div>
            </div>
        </div>
        <div class="bottom-nav">
            <div class="nav-tab active" onclick="nav('public', this)"><i class="fas fa-comments"></i><p style="font-size:10px;">Public</p></div>
            <div class="nav-tab" onclick="nav('dm', this)"><i class="fas fa-comment-dots"></i><p style="font-size:10px;">DMs</p></div>
            <div class="nav-tab" onclick="nav('profile', this)"><i class="fas fa-user-circle"></i><p style="font-size:10px;">Profile</p></div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDNwc4Ktuq-v5VX1ezzCNfK_sJmbFs2_x0",
            authDomain: "coremmc-hosting.firebaseapp.com",
            projectId: "coremmc-hosting",
            storageBucket: "coremmc-hosting.firebasestorage.app",
            messagingSenderId: "483642646077",
            appId: "1:483642646077:web:1e72697f704664e5af5454",
            databaseURL: "https://coremmc-chat-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();
        let activeUser = null;

        // 1. Auth Persistence Logic
        auth.onAuthStateChanged(user => {
            document.getElementById('main-loader').style.display = 'none';
            if(user) {
                activeUser = user;
                db.ref('users/' + user.uid).once('value', snap => {
                    const data = snap.val();
                    if(!data || !data.setupDone) {
                        document.getElementById('core-setup-popup').style.display = 'flex';
                        document.getElementById('auth-screen').style.display = 'none';
                    } else {
                        launchCoreApp();
                    }
                });
            } else {
                document.getElementById('auth-screen').style.display = 'flex';
                document.getElementById('app').classList.remove('show-app');
            }
        });

        // 2. Setup & Image Functions
        function previewImg(input, targetId, isBanner) {
            if (input.files && input.files[0]) {
                var reader = new FileReader();
                reader.onload = function(e) {
                    if(isBanner) document.getElementById(targetId).style.backgroundImage = `url(${e.target.result})`;
                    else document.getElementById(targetId).src = e.target.result;
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        function saveFinalProfile() {
            const name = document.getElementById('setup-username').value;
            const phone = document.getElementById('setup-phone').value;
            const addr = document.getElementById('setup-address').value;
            if(!name || !phone) return alert("Username and Phone are required!");

            db.ref('users/' + activeUser.uid).update({
                username: name, phone: phone, address: addr, setupDone: true, email: activeUser.email
            }).then(() => {
                activeUser.updateProfile({ displayName: name });
                document.getElementById('core-setup-popup').style.display = 'none';
                location.reload();
            });
        }

        // 3. UI Handlers
        function launchCoreApp() {
            document.getElementById('app').classList.add('show-app');
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('u-name-display').innerText = activeUser.displayName || "Core Member";
            document.getElementById('u-email-display').innerText = activeUser.email;
            document.getElementById('u-pfp').src = activeUser.photoURL || "https://cdn-icons-png.flaticon.com/512/149/149071.png";
            startChatSync();
        }

        function toggleView(m) {
            document.getElementById('login-fields').style.display = m === 'reg' ? 'none' : 'block';
            document.getElementById('reg-fields').style.display = m === 'reg' ? 'block' : 'none';
        }

        function handleRegister() {
            const e = document.getElementById('r-email').value;
            const p = document.getElementById('r-pass').value;
            const c = document.getElementById('r-confirm').value;
            if(p !== c) return alert("Passwords don't match!");
            auth.createUserWithEmailAndPassword(e, p).catch(err => alert(err.message));
        }

        function handleLogin() {
            const e = document.getElementById('l-email').value;
            const p = document.getElementById('l-pass').value;
            auth.signInWithEmailAndPassword(e, p).catch(err => alert(err.message));
        }

        function googleAuth() {
            auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
        }

        // 4. Chat Engine
        function startChatSync() {
            db.ref('public_chat').limitToLast(60).on('value', snap => {
                const area = document.getElementById('chat-area');
                area.innerHTML = "";
                snap.forEach(c => {
                    const m = c.val();
                    area.innerHTML += `<div class="message-bubble"><img src="${m.p}"><div class="msg-text-wrap"><div class="msg-user">${m.n}</div><div>${m.t}</div></div></div>`;
                });
                area.scrollTop = area.scrollHeight;
            });
        }

        function sendMsg() {
            const inp = document.getElementById('msg-in');
            if(!inp.value.trim()) return;
            db.ref('public_chat').push({
                n: activeUser.displayName || "Member",
                t: inp.value,
                p: activeUser.photoURL || "https://cdn-icons-png.flaticon.com/512/149/149071.png",
                ts: Date.now()
            });
            inp.value = "";
        }

        function nav(id, el) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            document.getElementById('sec-' + id).classList.add('active');
            el.classList.add('active');
        }
    </script>
</body>
</html>
