<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoreMMC - Chat & Hosting</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #313338;
            --sidebar-dark: #2b2d31;
            --nav-dark: #1e1f22;
            --text-main: #dbdee1;
            --accent: #5865f2;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); height: 100vh; overflow: hidden; }

        /* Auth Screen */
        #auth-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://media2.giphy.com/media/v1.Y2lkPTc5MGI3NjExamJlOHR5Y2Fod2s0ZWg2MzNuZzZqZXJjdTloeTJjZ2hrcTNpeTZ0ayZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/skzEY0OczUGwhamSxk/giphy.gif') center/cover;
            display: flex; justify-content: center; align-items: center; z-index: 1000;
        }

        .card {
            background: rgba(43, 45, 49, 0.95); padding: 30px; border-radius: 8px;
            width: 400px; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        input {
            width: 100%; padding: 10px; margin: 10px 0; background: #1e1f22;
            border: 1px solid #1e1f22; color: white; border-radius: 4px;
        }

        .btn {
            width: 100%; padding: 10px; border: none; border-radius: 4px;
            cursor: pointer; font-weight: bold; transition: 0.2s; margin-top: 10px;
        }
        .btn-primary { background: var(--accent); color: white; }
        .btn-google { background: white; color: black; margin-top: 15px; }

        /* Main Chat Layout */
        #app-interface { display: none; height: 100vh; grid-template-columns: 72px 240px 1fr; }

        .server-bar { background: var(--nav-dark); display: flex; flex-direction: column; align-items: center; padding: 12px 0; }
        .server-icon { width: 48px; height: 48px; background: #313338; border-radius: 50%; margin-bottom: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
        .server-icon:hover { border-radius: 15px; background: var(--accent); }

        .sidebar { background: var(--sidebar-dark); display: flex; flex-direction: column; }
        .sidebar-header { padding: 15px; font-weight: bold; border-bottom: 1px solid #232428; }
        .channel-list { padding: 10px; flex-grow: 1; }
        .channel-item { padding: 8px; border-radius: 4px; cursor: pointer; margin-bottom: 2px; color: #949ba4; }
        .channel-item:hover, .active-ch { background: #3f4147; color: white; }

        .chat-area { display: flex; flex-direction: column; background: var(--bg-dark); }
        .chat-header { height: 48px; border-bottom: 1px solid #232428; display: flex; align-items: center; padding: 0 15px; font-weight: bold; }
        #messages { flex-grow: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        
        .msg-container { display: flex; gap: 15px; }
        .msg-avatar { width: 40px; height: 40px; border-radius: 50%; background: #5865f2; }
        .msg-content { display: flex; flex-direction: column; }
        .msg-user { font-weight: bold; font-size: 0.9rem; color: white; }
        .msg-text { font-size: 0.95rem; color: var(--text-main); margin-top: 2px; }

        .input-box { padding: 20px; }
        .input-wrapper { background: #383a40; padding: 10px 15px; border-radius: 8px; display: flex; }
        .input-wrapper input { background: transparent; border: none; margin: 0; }

        /* Profile Modal */
        #profile-modal {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #1e1f22; width: 300px; border-radius: 15px; overflow: hidden; z-index: 2000;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        .banner { height: 60px; background: var(--accent); }
        .profile-info { padding: 40px 15px 15px; position: relative; text-align: center; }
        .p-avatar { width: 80px; height: 80px; border-radius: 50%; border: 6px solid #1e1f22; position: absolute; top: -40px; left: 15px; background: #5865f2;}
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="card" id="login-form">
            <h2>CoreMMC Hosting</h2>
            <p style="color: #b5bac1; font-size: 14px; margin: 8px 0 20px;">Welcome back!</p>
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="password" placeholder="Password">
            <button class="btn btn-primary" onclick="login()">Login</button>
            <button class="btn btn-google" onclick="googleLogin()">
                <img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" width="16"> Continue with Google
            </button>
            <p style="margin-top: 15px; font-size: 13px;">Need an account? <span style="color: #00a8fc; cursor:pointer;" onclick="toggleAuth()">Register</span></p>
        </div>

        <div class="card" id="register-form" style="display:none;">
            <h2>Create Account</h2>
            <input type="text" id="reg-user" placeholder="Username">
            <input type="email" id="reg-email" placeholder="Email">
            <input type="password" id="reg-pass" placeholder="Password">
            <button class="btn btn-primary" onclick="register()">Register</button>
            <p style="margin-top: 15px; font-size: 13px;">Already have an account? <span style="color: #00a8fc; cursor:pointer;" onclick="toggleAuth()">Login</span></p>
        </div>
    </div>

    <div id="app-interface">
        <div class="server-bar">
            <div class="server-icon"><i class="fab fa-discord fa-lg"></i></div>
            <div style="width: 32px; height: 2px; background: #35363c; margin: 8px 0;"></div>
            <div class="server-icon" style="border-radius: 15px; background: var(--accent);">C</div>
        </div>

        <div class="sidebar">
            <div class="sidebar-header">CoreMMC Hosting</div>
            <div class="channel-list">
                <div class="channel-item active-ch"><i class="fas fa-hashtag"></i> public-chat</div>
                <div class="channel-item"><i class="fas fa-hashtag"></i> announcements</div>
                <div style="margin-top: 20px; font-size: 12px; font-weight: bold; color: #949ba4; padding-left: 8px;">DIRECT MESSAGES</div>
                <div class="channel-item"><i class="fas fa-user"></i> CoreMMC Bot</div>
            </div>
            <div style="background: #232428; padding: 10px; display: flex; align-items: center; gap: 10px; cursor:pointer;" onclick="showProfile()">
                <div id="user-pfp" class="msg-avatar" style="width:32px; height:32px;"></div>
                <div style="font-size: 13px;">
                    <b id="user-display">User</b><br><span style="color:#b5bac1; font-size:11px;">#0001</span>
                </div>
            </div>
        </div>

        <div class="chat-area">
            <div class="chat-header"><i class="fas fa-hashtag" style="margin-right: 10px; color: #80848e;"></i> public-chat</div>
            <div id="messages">
                </div>
            <div class="input-box">
                <div class="input-wrapper">
                    <input type="text" id="chat-input" placeholder="Message #public-chat" onkeypress="if(event.key === 'Enter') sendMessage()">
                </div>
            </div>
        </div>
    </div>

    <div id="profile-modal" onclick="this.style.display='none'">
        <div class="banner"></div>
        <div class="profile-info">
            <div id="modal-pfp" class="p-avatar"></div>
            <h3 id="modal-name">Username</h3>
            <p style="color: #b5bac1; font-size: 12px;">CoreMMC Member</p>
            <hr style="margin: 15px 0; border: 0; border-top: 1px solid #35363c;">
            <button class="btn btn-primary" onclick="firebase.auth().signOut()">Logout</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.10.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.10.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.10.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDNwc4Ktuq-v5VX1ezzCNfK_sJmbFs2_x0",
            authDomain: "coremmc-hosting.firebaseapp.com",
            projectId: "coremmc-hosting",
            storageBucket: "coremmc-hosting.firebasestorage.app",
            messagingSenderId: "483642646077",
            appId: "1:483642646077:web:1e72697f704664e5af5454"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // --- Auth Logic ---
        function toggleAuth() {
            const login = document.getElementById('login-form');
            const reg = document.getElementById('register-form');
            login.style.display = login.style.display === 'none' ? 'block' : 'none';
            reg.style.display = reg.style.display === 'none' ? 'block' : 'none';
        }

        async function register() {
            const email = document.getElementById('reg-email').value;
            const pass = document.getElementById('reg-pass').value;
            const user = document.getElementById('reg-user').value;
            try {
                const res = await auth.createUserWithEmailAndPassword(email, pass);
                await res.user.updateProfile({ displayName: user });
                location.reload();
            } catch (e) { alert(e.message); }
        }

        async function login() {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            try { await auth.signInWithEmailAndPassword(email, pass); } catch (e) { alert(e.message); }
        }

        function googleLogin() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider);
        }

        // --- App Logic ---
        auth.onAuthStateChanged(user => {
            if (user) {
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('app-interface').style.display = 'grid';
                document.getElementById('user-display').innerText = user.displayName || user.email;
                const pfp = user.photoURL || 'https://ui-avatars.com/api/?name=' + user.displayName;
                document.getElementById('user-pfp').style.background = `url('${pfp}') center/cover`;
                loadMessages();
            } else {
                document.getElementById('auth-screen').style.display = 'flex';
                document.getElementById('app-interface').style.display = 'none';
            }
        });

        function showProfile() {
            const user = auth.currentUser;
            const pfp = user.photoURL || 'https://ui-avatars.com/api/?name=' + user.displayName;
            document.getElementById('modal-name').innerText = user.displayName;
            document.getElementById('modal-pfp').style.background = `url('${pfp}') center/cover`;
            document.getElementById('profile-modal').style.display = 'block';
        }

        async function sendMessage() {
            const input = document.getElementById('chat-input');
            if (!input.value.trim()) return;

            await db.collection("public-messages").add({
                text: input.value,
                uid: auth.currentUser.uid,
                userName: auth.currentUser.displayName,
                photo: auth.currentUser.photoURL || 'https://ui-avatars.com/api/?name=' + auth.currentUser.displayName,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
            input.value = "";
        }

        function loadMessages() {
            db.collection("public-messages").orderBy("timestamp", "asc").onSnapshot(snap => {
                const container = document.getElementById('messages');
                container.innerHTML = "";
                snap.forEach(doc => {
                    const m = doc.data();
                    container.innerHTML += `
                        <div class="msg-container">
                            <div class="msg-avatar" style="background: url('${m.photo}') center/cover"></div>
                            <div class="msg-content">
                                <span class="msg-user">${m.userName}</span>
                                <span class="msg-text">${m.text}</span>
                            </div>
                        </div>
                    `;
                });
                container.scrollTop = container.scrollHeight;
            });
        }
    </script>
</body>
</html>
