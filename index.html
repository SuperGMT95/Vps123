<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoreMMC - Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #3b82f6; --bg: #313338; --card: rgba(30, 41, 59, 0.8); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

        body {
            background: url('https://media2.giphy.com/media/v1.Y2lkPTc5MGI3NjExamJlOHR5Y2Fod2s0ZWg2MzNuZzZqZXJjdTloeTJjZ2hrcTNpeTZ0ayZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/skzEY0OczUGwhamSxk/giphy.gif') center/cover;
            height: 100vh; overflow: hidden; color: white;
        }

        /* --- OVERLAYS --- */
        .overlay {
            position: fixed; inset: 0; z-index: 1000;
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(15px);
            display: flex; justify-content: center; align-items: center;
        }

        .card {
            background: var(--card); padding: 30px; border-radius: 20px;
            width: 90%; max-width: 400px; text-align: center; border: 1px solid rgba(255,255,255,0.1);
        }

        input {
            width: 100%; padding: 12px; margin: 10px 0; border-radius: 10px;
            border: 1px solid #334155; background: #1e293b; color: white; outline: none;
        }

        .btn {
            width: 100%; padding: 12px; border: none; border-radius: 10px;
            font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px;
        }
        .btn-blue { background: #3b82f6; color: white; }
        .btn-white { background: white; color: #1e293b; }

        /* --- SETUP AREA --- */
        .pfp-upload { width: 90px; height: 90px; border-radius: 50%; border: 2px dashed #475569; margin: 10px auto; cursor: pointer; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .banner-upload { width: 100%; height: 60px; border-radius: 10px; border: 2px dashed #475569; margin-top: 10px; cursor: pointer; background-size: cover; }

        /* --- MAIN APP UI --- */
        #main-app { display: none; height: 100vh; flex-direction: column; background: var(--bg); }
        .app-body { display: flex; flex: 1; overflow: hidden; }
        
        /* Side Navigation */
        .side-nav { width: 72px; background: #1e1f22; display: flex; flex-direction: column; align-items: center; padding: 15px 0; gap: 15px; }
        .nav-icon { width: 48px; height: 48px; background: #313338; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; font-size: 20px; }
        .nav-icon.active { border-radius: 15px; background: var(--primary); }

        /* Main Sections */
        .content { flex: 1; display: flex; flex-direction: column; }
        .section { display: none; flex: 1; flex-direction: column; }
        .section.active { display: flex; }

        /* Chat Styles */
        #chat-area { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .msg { display: flex; gap: 12px; }
        .msg img { width: 40px; height: 40px; border-radius: 50%; }
        .msg-content { background: #383a40; padding: 10px 15px; border-radius: 15px; max-width: 85%; }
        .msg-user { font-size: 12px; font-weight: bold; color: var(--primary); margin-bottom: 3px; }

        .input-bar { padding: 20px; background: #313338; }
        .input-box { background: #383a40; border-radius: 8px; padding: 12px; display: flex; gap: 10px; align-items: center; }
        .input-box input { flex: 1; background: transparent; border: none; color: white; outline: none; margin: 0; padding: 0; }

        /* Bottom Menu */
        .bottom-menu { height: 60px; background: #232428; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #1e1f22; }
        .tab { color: #b5bac1; font-size: 22px; cursor: pointer; }
        .tab.active { color: white; }

        /* Profile View */
        .profile-card { padding: 30px; text-align: center; }
        .profile-img { width: 100px; height: 100px; border-radius: 50%; border: 4px solid var(--primary); margin-top: -50px; }
    </style>
</head>
<body>

    <div id="loader" class="overlay"><h2>Verifying Session...</h2></div>

    <div id="auth-overlay" class="overlay" style="display:none;">
        <div class="card" id="login-box">
            <img src="https://i.ibb.co/KzF67sFZ/copilot-image-1761965106943.png" width="80" style="border-radius:50%; margin-bottom:10px;">
            <h2>CoreMMC Hub</h2>
            <button class="btn btn-white" onclick="loginGoogle()"><img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" width="18"> Continue with Google</button>
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="pass" placeholder="Password">
            <button class="btn btn-blue" onclick="emailAction('login')">Log In</button>
            <p style="font-size:12px; margin-top:15px;">New? <a href="javascript:void(0)" onclick="toggleAuth('reg')" style="color:var(--primary)">Create One</a></p>
        </div>

        <div class="card" id="reg-box" style="display:none;">
            <h2>Create Account</h2>
            <input type="text" id="reg-name" placeholder="Full Name">
            <input type="email" id="reg-email" placeholder="Email">
            <input type="password" id="reg-pass" placeholder="Password">
            <button class="btn btn-blue" onclick="emailAction('reg')">Register Now</button>
            <p style="font-size:12px; margin-top:15px;"><a href="javascript:void(0)" onclick="toggleAuth('login')" style="color:var(--primary)">Back to Login</a></p>
        </div>
    </div>

    <div id="setup-overlay" class="overlay" style="display:none;">
        <div class="card">
            <h3>Complete Profile</h3>
            <div class="pfp-upload" onclick="document.getElementById('p-in').click()" id="p-pre">Avatar</div>
            <input type="file" id="p-in" hidden onchange="preview(this, 'p-pre')">
            
            <div class="banner-upload" onclick="document.getElementById('b-in').click()" id="b-pre">Banner</div>
            <input type="file" id="b-in" hidden onchange="preview(this, 'b-pre')">
            
            <button class="btn btn-blue" onclick="finishSetup()">Enter Chat</button>
            <span style="font-size:12px; cursor:pointer;" onclick="finishSetup()">Skip</span>
        </div>
    </div>

    <div id="main-app">
        <div class="app-body">
            <div class="side-nav">
                <div class="nav-icon active" onclick="showSec('chat')"><i class="fas fa-globe"></i></div>
                <div class="nav-icon" onclick="showSec('dm')"><i class="fas fa-user-friends"></i></div>
            </div>

            <div class="content">
                <div id="sec-chat" class="section active">
                    <div style="padding:15px; border-bottom:1px solid #1e1f22;"># public-chat</div>
                    <div id="chat-area"></div>
                    <div class="input-bar">
                        <div class="input-box">
                            <input type="text" id="m-in" placeholder="Message CoreMMC..." onkeypress="if(event.key==='Enter')sendMsg()">
                            <i class="fas fa-paper-plane" onclick="sendMsg()" style="color:var(--primary); cursor:pointer;"></i>
                        </div>
                    </div>
                </div>

                <div id="sec-dm" class="section">
                    <div style="padding:20px;"><h3>Personal DMs</h3><p style="color:#888;">Coming Soon...</p></div>
                </div>

                <div id="sec-profile" class="section">
                    <div class="profile-card">
                        <div style="height:100px; background:var(--primary); border-radius:15px;"></div>
                        <img src="" id="user-pfp" class="profile-img">
                        <h2 id="user-name" style="margin-top:10px;">User</h2>
                        <button class="btn btn-blue" style="max-width:150px; margin:20px auto;" onclick="auth.signOut()">Logout</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="bottom-menu">
            <div class="tab active" onclick="showSec('chat')"><i class="fas fa-comment-alt"></i></div>
            <div class="tab" onclick="showSec('dm')"><i class="fas fa-envelope"></i></div>
            <div class="tab" onclick="showSec('profile')"><i class="fas fa-user-circle"></i></div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>

    <script>
        const config = {
            apiKey: "AIzaSyDNwc4Ktuq-v5VX1ezzCNfK_sJmbFs2_x0",
            authDomain: "coremmc-hosting.firebaseapp.com",
            projectId: "coremmc-hosting",
            storageBucket: "coremmc-hosting.firebasestorage.app",
            messagingSenderId: "483642646077",
            appId: "1:483642646077:web:1e72697f704664e5af5454",
            databaseURL: "https://coremmc-chat-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(config);
        const auth = firebase.auth();
        const db = firebase.database();
        let currUser = null;

        // --- SESSION PERSISTENCE (Fix: Bar bar login nahi maangega) ---
        auth.onAuthStateChanged(u => {
            document.getElementById('loader').style.display = 'none';
            if(u) {
                currUser = u;
                document.getElementById('auth-overlay').style.display = 'none';
                document.getElementById('main-app').style.display = 'flex';
                loadUI();
            } else {
                document.getElementById('auth-overlay').style.display = 'flex';
                document.getElementById('main-app').style.display = 'none';
            }
        });

        function toggleAuth(type) {
            document.getElementById('login-box').style.display = type === 'reg' ? 'none' : 'block';
            document.getElementById('reg-box').style.display = type === 'reg' ? 'block' : 'none';
        }

        function loginGoogle() {
            auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
        }

        function emailAction(type) {
            if(type === 'reg') {
                const n = document.getElementById('reg-name').value;
                const e = document.getElementById('reg-email').value;
                const p = document.getElementById('reg-pass').value;
                auth.createUserWithEmailAndPassword(e, p).then(res => {
                    res.user.updateProfile({displayName: n});
                    document.getElementById('setup-overlay').style.display = 'flex';
                }).catch(err => alert(err.message));
            } else {
                const e = document.getElementById('email').value;
                const p = document.getElementById('pass').value;
                auth.signInWithEmailAndPassword(e, p).catch(err => alert(err.message));
            }
        }

        function finishSetup() {
            document.getElementById('setup-overlay').style.display = 'none';
        }

        function loadUI() {
            document.getElementById('user-name').innerText = currUser.displayName || "Core Member";
            document.getElementById('user-pfp').src = currUser.photoURL || "https://cdn-icons-png.flaticon.com/512/149/149071.png";
            
            // Sync Public Chat
            db.ref('public_chat').limitToLast(50).on('value', snap => {
                const area = document.getElementById('chat-area');
                area.innerHTML = "";
                snap.forEach(child => {
                    const d = child.val();
                    area.innerHTML += `
                        <div class="msg">
                            <img src="${d.pfp}">
                            <div class="msg-content">
                                <div class="msg-user">${d.name}</div>
                                <div>${d.text}</div>
                            </div>
                        </div>`;
                });
                area.scrollTop = area.scrollHeight;
            });
        }

        function sendMsg() {
            const input = document.getElementById('m-in');
            if(!input.value.trim()) return;
            db.ref('public_chat').push({
                name: currUser.displayName || "Core Member",
                text: input.value,
                pfp: currUser.photoURL || "https://cdn-icons-png.flaticon.com/512/149/149071.png",
                time: Date.now()
            });
            input.value = "";
        }

        function showSec(id) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.tab, .nav-icon').forEach(t => t.classList.remove('active'));
            document.getElementById('sec-'+id).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        function preview(input, id) {
            const reader = new FileReader();
            reader.onload = e => {
                const el = document.getElementById(id);
                if(id === 'p-pre') el.innerHTML = `<img src="${e.target.result}" style="width:100%; height:100%; object-fit:cover;">`;
                else el.style.backgroundImage = `url(${e.target.result})`;
            }
            reader.readAsDataURL(input.files[0]);
        }
    </script>
</body>
</html>
