<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoreMMC - Login & Register</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: url('https://media2.giphy.com/media/v1.Y2lkPTc5MGI3NjExamJlOHR5Y2Fod2s0ZWg2MzNuZzZqZXJjdTloeTJjZ2hrcTNpeTZ0ayZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/skzEY0OczUGwhamSxk/giphy.gif');
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .login-card {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 20px;
            width: 90%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            color: white;
            max-height: 95vh;
            overflow-y: auto;
        }

        /* Custom Scrollbar for the card */
        .login-card::-webkit-scrollbar { width: 5px; }
        .login-card::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 10px; }

        .logo {
            width: 70px;
            margin-bottom: 15px;
            border-radius: 50%;
            border: 2px solid #3b82f6;
        }

        h2 { font-size: 22px; margin-bottom: 5px; letter-spacing: 1px; }

        .social-btn {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-weight: 600;
            transition: 0.3s;
            font-size: 14px;
        }

        .google-btn { background: white; color: #1e293b; }
        .discord-btn { background: #5865F2; color: white; }

        .divider {
            margin: 15px 0;
            display: flex;
            align-items: center;
            color: #64748b;
            font-size: 12px;
        }

        .divider::before, .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #334155;
            margin: 0 10px;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 12px;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid #334155;
            border-radius: 10px;
            color: white;
            outline: none;
            font-size: 14px;
        }

        input:focus { border-color: #3b82f6; }

        .main-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            border: none;
            color: white;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
            transition: 0.3s;
        }

        .main-btn:hover { opacity: 0.9; transform: scale(1.02); }

        .footer-text { margin-top: 15px; font-size: 13px; }
        .footer-text span { color: #3b82f6; cursor: pointer; font-weight: bold; }

        #register-form { display: none; }
    </style>
</head>
<body>

    <div class="login-card">
        <img src="https://i.ibb.co/KzF67sFZ/copilot-image-1761965106943.png" alt="CoreMMC" class="logo">
        
        <div id="login-form">
            <h2>Welcome Back</h2>
            <p style="margin-bottom:20px; color:#94a3b8; font-size: 14px;">Login to CoreMMC Hosting</p>

            <button class="social-btn google-btn" onclick="googleAuth()">
                <img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" width="18"> Continue with Google
            </button>

            <button class="social-btn discord-btn">
                <i class="fab fa-discord"></i> Continue with Discord
            </button>

            <div class="divider">OR</div>

            <input type="email" id="login-email" placeholder="Email Address">
            <input type="password" id="login-pass" placeholder="Password">
            
            <button class="main-btn" onclick="emailLogin()">Log In</button>

            <div class="footer-text">
                Don't have an account? <span onclick="toggleForms('reg')">Create One</span>
            </div>
        </div>

        <div id="register-form">
            <h2>Join CoreMMC</h2>
            <p style="margin-bottom:20px; color:#94a3b8; font-size: 14px;">Create your hosting account</p>

            <input type="text" id="reg-user" placeholder="Full Name">
            <input type="email" id="reg-email" placeholder="Email Address">
            <input type="tel" id="reg-phone" placeholder="Phone Number (Optional)">
            <input type="text" id="reg-address" placeholder="Home Address (Optional)">
            <input type="password" id="reg-pass" placeholder="Create Password">
            <input type="password" id="reg-conf" placeholder="Confirm Password">
            
            <button class="main-btn" onclick="emailRegister()">Sign Up</button>

            <div class="footer-text">
                Already have an account? <span onclick="toggleForms('login')">Log In</span>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDNwc4Ktuq-v5VX1ezzCNfK_sJmbFs2_x0",
            authDomain: "coremmc-hosting.firebaseapp.com",
            projectId: "coremmc-hosting",
            storageBucket: "coremmc-hosting.firebasestorage.app",
            messagingSenderId: "483642646077",
            appId: "1:483642646077:web:1e72697f704664e5af5454",
            databaseURL: "https://coremmc-chat-default-rtdb.firebaseio.com"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        // Switch between Login and Register
        function toggleForms(type) {
            if(type === 'reg') {
                document.getElementById('login-form').style.display = 'none';
                document.getElementById('register-form').style.display = 'block';
            } else {
                document.getElementById('login-form').style.display = 'block';
                document.getElementById('register-form').style.display = 'none';
            }
        }

        // 1. Google Auth (With Data Sync)
        function googleAuth() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).then((res) => {
                alert("Welcome " + res.user.displayName);
                // Check if user exists in DB, if not, wait for next step
                window.location.href = "index.html"; 
            }).catch(e => alert(e.message));
        }

        // 2. Email Register
        function emailRegister() {
            const name = document.getElementById('reg-user').value;
            const email = document.getElementById('reg-email').value;
            const pass = document.getElementById('reg-pass').value;
            const conf = document.getElementById('reg-conf').value;
            const phone = document.getElementById('reg-phone').value;
            const addr = document.getElementById('reg-address').value;

            if(!name || !email || !pass) return alert("Please fill mandatory fields!");
            if(pass !== conf) return alert("Passwords do not match!");

            auth.createUserWithEmailAndPassword(email, pass).then((res) => {
                // Save additional data to Database
                db.ref('users/' + res.user.uid).set({
                    username: name,
                    email: email,
                    phone: phone || "Not Provided",
                    address: addr || "Not Provided",
                    setupDone: true
                }).then(() => {
                    res.user.updateProfile({ displayName: name });
                    alert("Account Created Successfully!");
                    // Abhi hum kahin redirect nahi karenge jab tak aap agla step na bolo
                });
            }).catch(e => alert(e.message));
        }

        // 3. Email Login
        function emailLogin() {
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-pass').value;
            if(!email || !pass) return alert("Fill details!");
            
            auth.signInWithEmailAndPassword(email, pass).then(() => {
                alert("Logged in!");
                window.location.href = "index.html";
            }).catch(e => alert(e.message));
        }
    </script>
    <div id="main-app" style="display:none; height: 100vh; width: 100%; position: fixed; top:0; left:0; background: white; flex-direction: column; z-index: 10000;">
    
    <div style="height: 60px; border-bottom: 1px solid #eee; display: flex; align-items: center; padding: 0 20px; background: white; font-weight: bold; color: #1e293b; gap: 10px;">
        <img src="https://i.ibb.co/KzF67sFZ/copilot-image-1761965106943.png" width="35" style="border-radius: 50%;">
        <span>CoreMMC Hub</span>
    </div>

    <div id="content-panel" style="flex: 1; overflow-y: auto; background: #f8f9fa; display: flex; flex-direction: column;">
        
        <div id="sec-public" class="app-section" style="display: flex; flex-direction: column; height: 100%;">
            <div id="chat-display" style="flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px;">
                </div>
            
            <div style="padding: 15px; background: white; border-top: 1px solid #eee; display: flex; gap: 10px; padding-bottom: 25px;">
                <input type="text" id="public-input" placeholder="Message CoreMMC..." style="flex:1; padding: 12px 20px; border: 1px solid #ddd; border-radius: 25px; outline: none; background: #f1f2f6;" onkeypress="if(event.key==='Enter')sendPublicMsg()">
                <button onclick="sendPublicMsg()" style="width: 45px; height: 45px; border-radius: 50%; border: none; background: #3b82f6; color: white; cursor: pointer;">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>

        <div id="sec-dm" class="app-section" style="display: none; padding: 40px; text-align: center; color: #64748b;">
            <i class="fas fa-user-shield" style="font-size: 50px; margin-bottom: 15px;"></i>
            <h3>Private Messages</h3>
            <p>Coming soon for verified clients.</p>
        </div>

        <div id="sec-profile" class="app-section" style="display: none; padding: 20px;">
            <div style="background: white; border-radius: 20px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center;">
                <img id="my-pfp" src="" style="width: 100px; height: 100px; border-radius: 50%; border: 4px solid #3b82f6; margin-bottom: 15px; object-fit: cover;">
                <h2 id="my-name" style="color: #1e293b;">User</h2>
                <p id="my-email" style="color: #64748b; font-size: 14px; margin-bottom: 20px;"></p>
                
                <button onclick="auth.signOut()" style="width: 100%; padding: 12px; background: #ef4444; color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer;">
                    <i class="fas fa-sign-out-alt"></i> Logout from Hub
                </button>
            </div>
        </div>
    </div>

    <div style="height: 70px; background: white; border-top: 1px solid #eee; display: flex; align-items: center; justify-content: space-around;">
        <div class="nav-btn active" onclick="switchTab('public', this)" style="text-align: center; cursor: pointer; color: #3b82f6;">
            <i class="fas fa-comments" style="font-size: 20px;"></i>
            <p style="font-size: 10px; margin-top: 4px; font-weight: bold;">Public</p>
        </div>
        <div class="nav-btn" onclick="switchTab('dm', this)" style="text-align: center; cursor: pointer; color: #94a3b8;">
            <i class="fas fa-paper-plane" style="font-size: 20px;"></i>
            <p style="font-size: 10px; margin-top: 4px; font-weight: bold;">DMs</p>
        </div>
        <div class="nav-btn" onclick="switchTab('profile', this)" style="text-align: center; cursor: pointer; color: #94a3b8;">
            <i class="fas fa-user-circle" style="font-size: 20px;"></i>
            <p style="font-size: 10px; margin-top: 4px; font-weight: bold;">Profile</p>
        </div>
    </div>

</div>

<script>
    // 1. Auth Listener to show/hide App
    auth.onAuthStateChanged(user => {
        if(user) {
            document.getElementById('main-app').style.display = 'flex';
            document.getElementById('my-name').innerText = user.displayName || "Core Member";
            document.getElementById('my-email').innerText = user.email;
            document.getElementById('my-pfp').src = user.photoURL || "https://cdn-icons-png.flaticon.com/512/149/149071.png";
            loadPublicChat();
        } else {
            document.getElementById('main-app').style.display = 'none';
        }
    });

    // 2. Tab Switching Logic
    function switchTab(tabId, el) {
        document.querySelectorAll('.app-section').forEach(s => s.style.display = 'none');
        document.querySelectorAll('.nav-btn').forEach(b => b.style.color = '#94a3b8');
        
        document.getElementById('sec-' + tabId).style.display = 'flex';
        if(tabId === 'profile' || tabId === 'dm') document.getElementById('sec-' + tabId).style.flexDirection = 'column';
        
        el.style.color = '#3b82f6';
    }

    // 3. Public Chat Engine
    function loadPublicChat() {
        db.ref('public_messages').limitToLast(50).on('value', snap => {
            const display = document.getElementById('chat-display');
            display.innerHTML = "";
            snap.forEach(child => {
                const msg = child.val();
                const isMe = msg.uid === auth.currentUser.uid;
                
                display.innerHTML += `
                    <div style="display: flex; gap: 10px; align-self: ${isMe ? 'flex-end' : 'flex-start'}; max-width: 80%; flex-direction: ${isMe ? 'row-reverse' : 'row'}">
                        <img src="${msg.pfp}" style="width: 30px; height: 30px; border-radius: 50%;">
                        <div style="background: ${isMe ? '#3b82f6' : 'white'}; color: ${isMe ? 'white' : '#1e293b'}; padding: 10px 15px; border-radius: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05);">
                            <div style="font-size: 10px; font-weight: bold; margin-bottom: 4px; opacity: 0.8;">${msg.name}</div>
                            <div style="font-size: 14px;">${msg.text}</div>
                        </div>
                    </div>
                `;
            });
            display.scrollTop = display.scrollHeight;
        });
    }

    function sendPublicMsg() {
        const inp = document.getElementById('public-input');
        if(!inp.value.trim()) return;

        db.ref('public_messages').push({
            uid: auth.currentUser.uid,
            name: auth.currentUser.displayName || "Core Member",
            text: inp.value,
            pfp: auth.currentUser.photoURL || "https://cdn-icons-png.flaticon.com/512/149/149071.png",
            timestamp: Date.now()
        });
        inp.value = "";
    }
</script>
</body>
</html>
