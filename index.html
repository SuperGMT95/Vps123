<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CoreMMC Hub - Official</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #5865F2;
            --sidebar: #1e1f22;
            --chat-bg: #ffffff;
            --text-main: #313338;
            --nav-bg: #f2f3f5;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body, html {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background: #000;
        }

        /* --- LOADING SCREEN --- */
        #loader {
            position: fixed; inset: 0; z-index: 9999;
            background: #1e1f22; display: flex; flex-direction: column;
            align-items: center; justify-content: center; color: white;
        }
        .spinner {
            width: 50px; height: 50px; border: 5px solid rgba(255,255,255,0.1);
            border-top: 5px solid var(--primary); border-radius: 50%;
            animation: rotate 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes rotate { to { transform: rotate(360deg); } }

        /* --- AUTH SYSTEM --- */
        .auth-screen {
            position: fixed; inset: 0; z-index: 9000;
            background: url('https://media2.giphy.com/media/v1.Y2lkPTc5MGI3NjExamJlOHR5Y2Fod2s0ZWg2MzNuZzZqZXJjdTloeTJjZ2hrcTNpeTZ0ayZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/skzEY0OczUGwhamSxk/giphy.gif') center/cover;
            display: flex; align-items: center; justify-content: center; backdrop-filter: blur(10px);
        }
        .auth-container {
            background: rgba(255, 255, 255, 0.95); padding: 40px; border-radius: 20px;
            width: 90%; max-width: 400px; box-shadow: 0 15px 35px rgba(0,0,0,0.3); text-align: center;
        }
        .auth-container h2 { color: var(--primary); margin-bottom: 25px; font-size: 24px; }
        .auth-container input {
            width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd;
            border-radius: 8px; outline: none; background: #f9f9f9;
        }
        .auth-btn {
            width: 100%; padding: 14px; border: none; border-radius: 8px;
            background: var(--primary); color: white; font-weight: bold;
            cursor: pointer; transition: 0.2s; font-size: 16px;
        }
        .auth-btn:active { transform: scale(0.98); }
        .switch-auth { margin-top: 20px; font-size: 14px; color: #555; cursor: pointer; }

        /* --- MAIN APP LAYOUT --- */
        #app {
            display: none; height: 100vh; width: 100vw;
            flex-direction: column; background: var(--nav-bg);
        }

        .main-content { display: flex; flex: 1; overflow: hidden; }

        /* Sidebar (Desktop) */
        .sidebar {
            width: 72px; background: var(--sidebar); display: flex;
            flex-direction: column; align-items: center; padding-top: 15px; gap: 12px;
        }
        .side-icon {
            width: 48px; height: 48px; background: #313338; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: #dbdee1; font-size: 20px; cursor: pointer; transition: 0.2s;
        }
        .side-icon.active, .side-icon:hover { border-radius: 15px; background: var(--primary); color: white; }

        /* Content Panel */
        .view-panel { flex: 1; display: flex; flex-direction: column; background: var(--chat-bg); }
        .section { display: none; flex: 1; flex-direction: column; }
        .section.active { display: flex; }

        /* --- PUBLIC CHAT UI --- */
        .header { height: 50px; border-bottom: 1px solid #e3e5e8; display: flex; align-items: center; padding: 0 15px; font-weight: bold; color: #313338; }
        
        #chat-flow { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 15px; background: #fff; }
        .chat-msg { display: flex; gap: 12px; align-items: flex-start; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        .chat-msg img { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; background: #eee; }
        .msg-body { flex: 1; }
        .msg-meta { display: flex; align-items: baseline; gap: 8px; margin-bottom: 2px; }
        .msg-user { font-weight: 700; color: #060607; font-size: 15px; }
        .msg-time { font-size: 11px; color: #5c6066; }
        .msg-txt { color: #2e3338; line-height: 1.4; word-wrap: break-word; font-size: 14.5px; }

        .footer-input { padding: 15px; background: #fff; border-top: 1px solid #f0f0f0; }
        .input-wrap { background: #ebedef; border-radius: 8px; padding: 10px 15px; display: flex; align-items: center; gap: 12px; }
        .input-wrap input { flex: 1; background: transparent; border: none; outline: none; font-size: 15px; color: #313338; }
        .send-btn { color: var(--primary); font-size: 20px; cursor: pointer; transition: 0.2s; }
        .send-btn:hover { transform: scale(1.1); }

        /* --- PROFILE VIEW --- */
        .profile-box { flex: 1; overflow-y: auto; background: #f2f3f5; }
        .banner { height: 160px; background: var(--primary); position: relative; }
        .pfp-large { 
            width: 100px; height: 100px; border: 6px solid #f2f3f5; border-radius: 50%;
            position: absolute; bottom: -50px; left: 20px; background: #eee; object-fit: cover;
        }
        .profile-details { padding: 60px 20px 20px; }
        .profile-details h1 { font-size: 24px; color: #060607; }
        .action-card { background: white; margin-top: 20px; border-radius: 12px; padding: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }

        /* --- BOTTOM NAVIGATION --- */
        .bottom-nav { 
            height: 65px; background: #ffffff; border-top: 1px solid #e3e5e8;
            display: flex; justify-content: space-around; align-items: center;
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #5c6066; cursor: pointer; font-size: 11px; gap: 4px; }
        .nav-item i { font-size: 22px; }
        .nav-item.active { color: var(--primary); }

    </style>
</head>

                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="bottom-nav">
            <div class="nav-item active" onclick="switchTab('public', this)"><i class="fas fa-comments"></i><span>Public</span></div>
            <div class="nav-item" onclick="switchTab('dm', this)"><i class="fas fa-user-friends"></i><span>DMs</span></div>

    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDNwc4Ktuq-v5VX1ezzCNfK_sJmbFs2_x0",
            authDomain: "coremmc-hosting.firebaseapp.com",
            projectId: "coremmc-hosting",
            storageBucket: "coremmc-hosting.firebasestorage.app",
            messagingSenderId: "483642646077",
            appId: "1:483642646077:web:1e72697f704664e5af5454",
            databaseURL: "https://coremmc-chat-default-rtdb.firebaseio.com"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        let user = null;

        // --- SESSION PERSISTENCE (Login Fix) ---
        auth.onAuthStateChanged(u => {
            document.getElementById('loader').style.display = 'none';
            if (u) {
                user = u;
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('app').style.display = 'flex';
                initApp();
            } else {
                document.getElementById('auth-screen').style.display = 'flex';
                document.getElementById('app').style.display = 'none';
            }
        });

        // --- AUTH LOGIC ---
        function toggleAuth(mode) {
            document.getElementById('register-box').style.display = mode === 'reg' ? 'block' : 'none';
            document.getElementById('login-box').style.display = mode === 'reg' ? 'none' : 'block';
        }

        function handleRegister() {
            const n = document.getElementById('reg-name').value;
            const e = document.getElementById('reg-email').value;
            const p = document.getElementById('reg-pass').value;
            if(!n || !e || !p) return alert("Fill everything!");

            auth.createUserWithEmailAndPassword(e, p).then(res => {
                res.user.updateProfile({ displayName: n });
                // Redirect will happen automatically via onAuthStateChanged
            }).catch(err => alert(err.message));
        }

        function handleLogin() {
            const e = document.getElementById('log-email').value;
            const p = document.getElementById('log-pass').value;
            auth.signInWithEmailAndPassword(e, p).catch(err => alert(err.message));
        }

        function googleSignIn() {
            auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
        }

        function logout() {
            if(confirm("Logout?")) auth.signOut();
        }

        // --- CORE APP LOGIC ---
        function initApp() {
            document.getElementById('display-name').innerText = user.displayName || "Core Member";
            document.getElementById('display-pfp').src = user.photoURL || "https://cdn-icons-png.flaticon.com/512/149/149071.png";
            loadMessages();
        }

        function switchTab(id, el) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item, .side-icon').forEach(i => i.classList.remove('active'));
            document.getElementById('sec-' + id).classList.add('active');
            el.classList.add('active');
        }

        function handleKey(e) { if(e.key === 'Enter') sendPublicMsg(); }

        function sendPublicMsg() {
            const input = document.getElementById('chat-input');
            const txt = input.value.trim();
            if(!txt) return;

            db.ref('public_chat').push({
                u: user.displayName || "User",
                t: txt,
                p: user.photoURL || "https://cdn-icons-png.flaticon.com/512/149/149071.png",
                time: Date.now()
            });
            input.value = "";
        }

        function loadMessages() {
            const flow = document.getElementById('chat-flow');
            db.ref('public_chat').limitToLast(50).on('value', snap => {
                flow.innerHTML = "";
                snap.forEach(child => {
                    const m = child.val();
                    const d = new Date(m.time).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
                    flow.innerHTML += `
                        <div class="chat-msg">
                            <img src="${m.p}">
                            <div class="msg-body">
                                <div class="msg-meta"><span class="msg-user">${m.u}</span><span class="msg-time">${d}</span></div>
                                <div class="msg-txt">${m.t}</div>
                            </div>
                        </div>`;
                });
                flow.scrollTop = flow.scrollHeight;
            });
        }

        function updateImage(type) {
            const file = event.target.files[0];
            const reader = new FileReader();
            reader.onload = (e) => {
                if(type === 'pfp') document.getElementById('display-pfp').src = e.target.result;
                else document.getElementById('user-banner').style.backgroundImage = `url(${e.target.result})`;
            };
            reader.readAsDataURL(file);
        }

    <h2 style="margin-top:15px;">CoreMMC Hosting</h2>
</div>

<div id="auth-screen" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:9000; overflow-y:auto; padding:20px;">
    <div style="background:white; max-width:450px; margin:20px auto; padding:30px; border-radius:20px; text-align:center;">
        <img src="https://i.ibb.co/KzF67sFZ/copilot-image-1761965106943.png" width="80" style="border-radius:50%;">
        <h2 style="color:#313338; margin:10px 0;">CoreMMC Hub</h2>
        
        <div id="login-form">
            <input type="email" id="l-email" placeholder="Email" style="width:100%; padding:12px; margin:10px 0; border:1px solid #ddd; border-radius:8px;">
            <input type="password" id="l-pass" placeholder="Password" style="width:100%; padding:12px; margin:10px 0; border:1px solid #ddd; border-radius:8px;">
            <button onclick="handleLogin()" style="width:100%; padding:14px; background:#5865F2; color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">Login</button>

        </div>

        <div id="reg-form" style="display:none;">
            <input type="text" id="r-name" placeholder="Full Name" style="width:100%; padding:12px; margin:8px 0; border:1px solid #ddd; border-radius:8px;">
            <input type="email" id="r-email" placeholder="Email Address" style="width:100%; padding:12px; margin:8px 0; border:1px solid #ddd; border-radius:8px;">
            <input type="tel" id="r-phone" placeholder="Phone Number" style="width:100%; padding:12px; margin:8px 0; border:1px solid #ddd; border-radius:8px;">
            <input type="text" id="r-addr" placeholder="Address (Optional)" style="width:100%; padding:12px; margin:8px 0; border:1px solid #ddd; border-radius:8px;">
            <input type="password" id="r-pass" placeholder="Password" style="width:100%; padding:12px; margin:8px 0; border:1px solid #ddd; border-radius:8px;">
            <input type="password" id="r-confirm" placeholder="Confirm Password" style="width:100%; padding:12px; margin:8px 0; border:1px solid #ddd; border-radius:8px;">
            <button onclick="handleRegister()" style="width:100%; padding:14px; background:#5865F2; color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">Register Now</button>
            <p style="margin-top:15px; cursor:pointer; color:#5865F2;" onclick="toggleAuth()">Back to Login</p>
        </div>
    </div>
</div>

<div id="app" style="display:none; height:100vh; flex-direction:column; background:white;">
    <div id="content-area" style="flex:1; overflow-y:auto; display:flex; flex-direction:column;">
        
        <div id="sec-public" class="section" style="display:flex; flex-direction:column; height:100%;">
            <div style="padding:15px; border-bottom:1px solid #eee; font-weight:bold; background:white; position:sticky; top:0; z-index:10; display:flex; align-items:center; gap:10px;">

                <button onclick="sendMsg()" style="background:#5865F2; color:white; border:none; width:45px; height:45px; border-radius:50%; cursor:pointer;"><i class="fas fa-paper-plane"></i></button>
            </div>
        </div>

        <div id="sec-dm" class="section" style="display:none; padding:20px; text-align:center; color:#888;">

            <p>Coming Soon for CoreMMC Members</p>
        </div>

        <div id="sec-profile" class="section" style="display:none;">
            <div id="profile-banner" style="height:150px; background:#5865F2; position:relative;">
                <img id="p-img" src="" style="width:100px; height:100px; border:5px solid white; border-radius:50%; position:absolute; bottom:-50px; left:20px; background:#eee;">
                <label for="pfp-up" style="position:absolute; bottom:-45px; left:85px; background:white; border-radius:50%; padding:5px; cursor:pointer; border:1px solid #ddd;"><i class="fas fa-camera"></i></label>

                </div>
                <button onclick="changeName()" style="width:100%; padding:12px; margin-top:10px; border:1px solid #5865F2; background:none; color:#5865F2; border-radius:8px; cursor:pointer;">Change Name</button>
                <button onclick="auth.signOut()" style="width:100%; padding:12px; margin-top:10px; background:#ed4245; color:white; border:none; border-radius:8px; cursor:pointer;">Logout</button>
            </div>

    </div>

    <div style="height:70px; border-top:1px solid #eee; display:flex; justify-content:space-around; align-items:center; background:#fff;">
        <div onclick="showSection('public')" class="nav-btn active" style="text-align:center; cursor:pointer; color:#5865F2;">
            <i class="fas fa-comments" style="font-size:20px;"></i><div style="font-size:12px;">Chat</div>
        </div>
        <div onclick="showSection('dm')" class="nav-btn" style="text-align:center; cursor:pointer; color:#888;">

<script>
// Logic starts here
const auth = firebase.auth();
const db = firebase.database();
let currentUser = null;

auth.onAuthStateChanged(user => {
    document.getElementById('main-loader').style.display = 'none';
    if(user) {
        currentUser = user;
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('app').style.display = 'flex';
        loadChat();
        updateProfileUI();
    } else {
        document.getElementById('auth-screen').style.display = 'flex';
        document.getElementById('app').style.display = 'none';
    }
});

function toggleAuth() {
    const l = document.getElementById('login-form');
    const r = document.getElementById('reg-form');
    l.style.display = l.style.display === 'none' ? 'block' : 'none';
    r.style.display = r.style.display === 'none' ? 'block' : 'none';
}

function handleRegister() {
    const name = document.getElementById('r-name').value;
    const email = document.getElementById('r-email').value;
    const pass = document.getElementById('r-pass').value;
    const conf = document.getElementById('r-confirm').value;
    const phone = document.getElementById('r-phone').value;
    const addr = document.getElementById('r-addr').value;

    if(!name || !email || !pass || pass !== conf) return alert("Passwords must match and fields cannot be empty!");

    auth.createUserWithEmailAndPassword(email, pass).then(res => {
        res.user.updateProfile({displayName: name});
        db.ref('users/' + res.user.uid).set({
            name: name, phone: phone, address: addr, email: email
        });
    }).catch(e => alert(e.message));
}

function handleLogin() {
    const e = document.getElementById('l-email').value;
    const p = document.getElementById('l-pass').value;
    auth.signInWithEmailAndPassword(e, p).catch(err => alert(err.message));
}

function showSection(id) {
    document.querySelectorAll('.section').forEach(s => s.style.display = 'none');
    document.getElementById('sec-' + id).style.display = 'flex';
    if(id === 'profile') document.getElementById('sec-profile').style.display = 'block';
}

function sendMsg() {
    const input = document.getElementById('msg-input');
    if(!input.value.trim()) return;
    db.ref('public_chat').push({
        name: currentUser.displayName || "Core Member",
        text: input.value,
        pfp: currentUser.photoURL || "https://cdn-icons-png.flaticon.com/512/149/149071.png",
        time: Date.now()
    });
    input.value = "";
}

function loadChat() {
    const box = document.getElementById('chat-messages');
    db.ref('public_chat').limitToLast(50).on('value', snap => {
        box.innerHTML = "";
        snap.forEach(child => {
            const m = child.val();
            box.innerHTML += `
                <div style="display:flex; gap:10px; margin-bottom:15px;">
                    <img src="${m.pfp}" width="40" height="40" style="border-radius:50%;">
                    <div>
                        <div style="font-weight:bold; font-size:13px; color:#5865F2;">${m.name}</div>
                        <div style="background:#f1f2f6; padding:8px 12px; border-radius:0 15px 15px 15px; margin-top:2px;">${m.text}</div>
                    </div>
                </div>`;
        });
        box.scrollTop = box.scrollHeight;
    });
}

function updateProfileUI() {
    document.getElementById('p-name').innerText = currentUser.displayName || "User";
    document.getElementById('p-email').innerText = currentUser.email;
    document.getElementById('p-img').src = currentUser.photoURL || "https://cdn-icons-png.flaticon.com/512/149/149071.png";
}

function changeName() {
    const newName = prompt("Enter new name:");
    if(newName) {
        currentUser.updateProfile({displayName: newName});
        db.ref('users/' + currentUser.uid).update({name: newName});
        document.getElementById('p-name').innerText = newName;
    }
}
</script>

@keyframes spin { to { transform: rotate(360deg); } }
.nav-btn.active { color: #5865F2 !important; }
</style>
